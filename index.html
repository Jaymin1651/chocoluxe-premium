<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChocoLuxe Premium handmade chocolates" />
    <title>ChocoLuxe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="mobile-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn home-btn" type="button" aria-label="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-7H9v7H5a1 1 0 0 1-1-1v-8.5Z"/></svg>
          </button>
          <div class="topbar-search">chocoluxe.app/#coll</div>
        </div>
        <div class="topbar-right">
          <button class="icon-btn add-btn" type="button" aria-label="Add item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v14h-2zm-6 6h14v2H5z"/></svg>
          </button>
          <div class="tray-pill" id="topTrayCount">0</div>
          <button class="icon-btn menu-btn" type="button" aria-label="Menu">
            <span></span><span></span><span></span>
          </button>
        </div>
      </header>

      <main class="page">
        <section class="brand-panel">
          <div class="brand-row">
            <div class="brand-badge">
              <img src="IMG-20260826-WA0007.jpg" alt="ChocoLuxe logo" />
              <span>ChocoLuxe</span>
            </div>
            <button class="tray-button" id="trayButtonHome" type="button">Your tray 0</button>
          </div>

          <h1>Indulge on every box.</h1>
          <a class="cta-button" href="#collection">Enquire on WhatsApp</a>
        </section>

        <section class="collection-section" id="collection">
          <div class="collection-header">
            <div class="mini-brand">
              <img src="IMG-20260826-WA0007.jpg" alt="ChocoLuxe logo" />
              <span>ChocoLuxe</span>
            </div>
            <h2>ChocoLuxe</h2>
            <p>Handmade chocolate gifting</p>
          </div>

          <div id="productList" class="product-list" aria-live="polite"></div>
        </section>

        <section class="drawer-menu">
          <div class="drawer-body">
            <div class="menu-block">
              <span class="menu-label">EXPLORE</span>
              <a href="#collection">Collection</a>
              <a href="#collection">Our craft</a>
              <a href="#collection">Wholesale</a>
            </div>
            <div class="menu-block">
              <span class="menu-label">CONTACT</span>
              <a href="https://wa.me/919974157344" target="_blank" rel="noreferrer">WhatsApp enquiry</a>
              <a href="#collection">FSSAI certified</a>
            </div>
          </div>
        </section>
      </main>

      <div class="tray-bar" id="trayBar" role="status" aria-live="polite">
        <div class="tray-copy">
          <span class="tray-tag">YOUR TASTING TRAY</span>
          <div class="tray-summary">
            <strong id="trayCount">0 boxes</strong>
            <span id="trayPrice">₹0</span>
          </div>
        </div>
        <button class="tray-action" id="trayAction" type="button">
          <span>Review</span>
          <strong>tray</strong>
        </button>
      </div>
    </div>
  </body>
</html>
